# Deploy static site to GitHub Pages
name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deployment (real check)
        run: |
          echo "🔍 Verifying live deployment..."
          echo "Expected commit: ${{ github.sha }}"
          UA="Mozilla/5.0 (compatible; CI)"
          BASE="https://jackwude.github.io/zhongwen-suanzhi"
          # 1. 主页返回 200
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" "$BASE/")
          echo "Home page HTTP: $HTTP_CODE"
          test "$HTTP_CODE" = "200" || { echo "❌ Home page not 200"; exit 1; }
          # 2. 核心 JS 可加载（Vite 产物 index-*.js）
          MAIN_JS=$(curl -s -A "$UA" "$BASE/" | grep -oE 'assets/index-[^"]+\.js' | head -1)
          echo "Main JS: $MAIN_JS"
          if [ -n "$MAIN_JS" ]; then
            JS_CODE=$(curl -s -o /dev/null -w "%{http_code}" -A "$UA" "$BASE/$MAIN_JS")
            echo "Main JS HTTP: $JS_CODE"
            test "$JS_CODE" = "200" || { echo "❌ Main JS not 200"; exit 1; }
          else
            echo "⚠️ 未找到主 JS（可能是内联），跳过 JS 检查"
          fi
          echo "✅ Live deployment verified: $BASE"
